                                                                               
                          
                     
                  
                                                               
                                                                               

worker_processes 4;

error_log /usr/local/soft/nginx-1.28.0/logs/error.log warn;
pid /usr/local/soft/nginx-1.28.0/logs/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include /usr/local/soft/nginx-1.28.0/conf/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

    charset utf-8;
    charset_types text/css text/plain text/xml text/javascript application/json application/javascript;

    server_tokens off;
                                                  
    client_max_body_size 520m;

    upstream backend {
        server 192.168.153.131:9090;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

                                                                             
                                                                            
                                                                          
    limit_req_zone $binary_remote_addr zone=media_requests_per_ip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=media_connections_per_ip:10m;
    limit_req_zone $binary_remote_addr zone=emoji_uploads_per_ip:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=emoji_upload_connections_per_ip:10m;
    limit_req_zone $binary_remote_addr zone=submission_uploads_per_ip:10m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=submission_upload_connections_per_ip:10m;

    server {
        listen 3223;
        server_name 192.168.153.131;

        root /sdb1/myprojoct/haoranmusic/hao-ran-music-frontend/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

                                        
        location /api/ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

                                 
        location ~ ^/api/(song|mv)/stream/[0-9]+$ {
            access_log off;
            limit_req zone=media_requests_per_ip burst=40 nodelay;
            limit_conn media_connections_per_ip 8;
            limit_rate_after 1m;
            limit_rate 8m;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

                                                 
        location /__media_origin/songs/ {
            internal;
            proxy_pass http://192.168.153.133:8081/songs/;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /__media_origin/mvs/ {
            internal;
            proxy_pass http://192.168.153.133:8081/mvs/;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

                                      
        location ~ ^/api/emoji/package/[0-9]+/emojis/upload$ {
            client_max_body_size 101m;
            client_body_timeout 30s;
            limit_req zone=emoji_uploads_per_ip burst=4 nodelay;
            limit_conn emoji_upload_connections_per_ip 2;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

                                             
        location ~ ^/api/upload/multi-file/(batch|extract-zip)$ {
            client_max_body_size 520m;
            client_body_timeout 600s;
            limit_req zone=submission_uploads_per_ip burst=2 nodelay;
            limit_conn submission_upload_connections_per_ip 2;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

                                       
        location = /api/song/resource-request/upload {
            client_max_body_size 520m;
            client_body_timeout 600s;
            limit_req zone=submission_uploads_per_ip burst=2 nodelay;
            limit_conn submission_upload_connections_per_ip 2;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

                                
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

                                        
        location /song-requests/ {
            proxy_pass http://192.168.153.132:8082/;
            proxy_set_header Host $host;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin *;
            expires 7d;
        }

                                                              
        location ^~ /payment-assets/proof/ {
            return 404;
        }

                                                          
        location /payment-assets/ {
            proxy_pass http://192.168.153.132:8082/payment/;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin *;
            expires 7d;
        }

                                             
        location /__post_media/posts/images/ {
            internal;
            alias /sdb1/myprojoct/haoranmusic/posts/images/;
            add_header Accept-Ranges bytes;
        }

        location /posts/images/ {
            return 404;
        }

                                                       
        location /multi-files/ {
            alias /sdb1/myprojoct/haoranmusic/multi-files/;
            expires 7d;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin *;
            add_header Accept-Ranges bytes;
        }

                                          
        location ~ "^/(?<legacy_multi_file_path>[0-9]{4}/[0-9]{2}/[0-9]+/.+)$" {
            alias /sdb1/myprojoct/haoranmusic/multi-files/$legacy_multi_file_path;
            expires 7d;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin *;
            add_header Accept-Ranges bytes;
        }

                        
        location /images/ {
            proxy_pass http://192.168.153.133:8081/images/;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin *;
        }

                                        
        location /emojis/ {
            proxy_pass http://192.168.153.133:8081/emojis/;
            proxy_set_header Host $host;
            proxy_hide_header Expires;
            proxy_hide_header Cache-Control;
            expires off;
            add_header Cache-Control "public, max-age=0, must-revalidate";
            add_header Access-Control-Allow-Origin *;
        }

                                         
        location /songs/ {
            return 404;
        }

                           
        location /mvs/ {
            return 404;
        }

                                 
        location /__post_media/posts/videos/ {
            internal;
            limit_req zone=media_requests_per_ip burst=40 nodelay;
            limit_conn media_connections_per_ip 8;
            limit_rate_after 1m;
            limit_rate 8m;
            proxy_pass http://192.168.153.133:8081/posts/videos/;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            add_header Accept-Ranges bytes;
        }

        location /posts/videos/ {
            return 404;
        }

                        
        location /covers/ {
            proxy_pass http://192.168.153.133:8081/covers/;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin *;
        }

                        
        location /avatars/ {
            proxy_pass http://192.168.153.133:8081/images/avatars/;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin *;
        }

                        
        location /playlist-covers/ {
            proxy_pass http://192.168.153.133:8081/images/playlist-covers/;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin *;
        }
    }
}
