                     
                                                             
                  
                 

bind 192.168.153.133 127.0.0.1
protected-mode no
port 6379
tcp-backlog 511

daemonize yes
pidfile /usr/local/soft/redis5.0.14/redis-node3.pid
loglevel notice
logfile /usr/local/soft/redis5.0.14/logs/redis-node3.log
databases 16

dbfilename dump-node3.rdb
dir  /usr/local/soft/redis5.0.14/data

save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes

appendonly yes
appendfilename "appendonly-node3.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

replicaof 192.168.153.131 6379
masterauth ${REDIS_PASSWORD}
replica-read-only yes
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
replica-priority 100

requirepass ${REDIS_PASSWORD}
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG "CONFIG_a8f3k2"
maxclients 10000
timeout 0
tcp-keepalive 300
