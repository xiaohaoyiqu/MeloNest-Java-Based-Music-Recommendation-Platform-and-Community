





server:
  port: 9090
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:

    threads:
      max: 300
      min-spare: 20
    accept-count: 200
    max-connections: 8192

    connection-timeout: 20000
    keep-alive-timeout: 60000
    max-keep-alive-requests: 1000
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

spring:
  application:
    name: hao-ran-music
  main:
    allow-circular-references: true


  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      "mail.smtp.auth": ${SMTP_AUTH:true}
      "mail.smtp.ssl.enable": ${SMTP_SSL_ENABLED:true}
      "mail.smtp.starttls.enable": ${SMTP_STARTTLS_ENABLED:false}
      "mail.smtp.connectiontimeout": ${SMTP_CONNECT_TIMEOUT_MILLIS:5000}
      "mail.smtp.timeout": ${SMTP_READ_TIMEOUT_MILLIS:5000}
      "mail.smtp.writetimeout": ${SMTP_WRITE_TIMEOUT_MILLIS:5000}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher


  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.jdbc.Driver
      url: ${DB_URL:jdbc:mysql://192.168.153.131:3306/haoranmusic_bus?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&useLocalSessionState=true&cachePrepStmts=true&useServerPrepStmts=true&useUnbufferedIO=false&useReadAheadInput=false&maintainTimeStats=false}
      username: ${DB_USERNAME:hdfs}
      password: ${DB_PASSWORD:}

      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 10000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

      remove-abandoned: true
      remove-abandoned-timeout: 1800
      log-abandoned: true

      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: ${DRUID_USERNAME:admin}
        login-password: ${DRUID_PASSWORD:}
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          enabled: true
          config:
            multi-statement-allow: true


  redis:
    host: ${REDIS_HOST:192.168.153.131}
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 10
        max-wait: 5000ms

      shutdown-timeout: 100ms

    cache:
      type: redis
      redis:
        time-to-live: 5000
        cache-null-values: false
        key-prefix: "hrm:"
        use-key-prefix: true


  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null


  servlet:
    multipart:
      max-file-size: 500MB

      max-request-size: 520MB
      enabled: true

      file-size-threshold: 0


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:192.168.153.131:9092,192.168.153.132:9092,192.168.153.133:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      batch-size: 16384
      buffer-memory: 33554432
    consumer:
      group-id: music-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer


search:
  engine: ${SEARCH_ENGINE:mysql}
  elasticsearch:
    enabled: ${SEARCH_ES_ENABLED:false}
    uris: ${SEARCH_ES_URIS:http://127.0.0.1:9200}
    username: ${SEARCH_ES_USERNAME:}
    password: ${SEARCH_ES_PASSWORD:}
    index-prefix: ${SEARCH_ES_INDEX_PREFIX:haoran_music}
    connect-timeout-ms: ${SEARCH_ES_CONNECT_TIMEOUT_MS:1000}
    socket-timeout-ms: ${SEARCH_ES_SOCKET_TIMEOUT_MS:2000}
    rebuild-enabled: ${SEARCH_ES_REBUILD_ENABLED:false}
    rebuild-cron: "${SEARCH_ES_REBUILD_CRON:0 0 3 * * ?}"
    bootstrap-rebuild-enabled: ${SEARCH_ES_BOOTSTRAP_REBUILD_ENABLED:true}
    bootstrap-min-documents: ${SEARCH_ES_BOOTSTRAP_MIN_DOCUMENTS:2}


cache:
  mv:
    expire: ${CACHE_MV_EXPIRE:1800}
  song:
    expire: ${CACHE_SONG_EXPIRE:3600}
  recommend:
    expire: ${CACHE_RECOMMEND_EXPIRE:1800}
  hot:
    expire: ${CACHE_HOT_EXPIRE:86400}
  null-value:
    expire: ${CACHE_NULL_EXPIRE:300}


schedule:
  cache-warmup:
    hourly-cron: "${SCHEDULE_CACHE_WARMUP_HOURLY_CRON:0 5 * * * ?}"
    rankings-cron: "${SCHEDULE_CACHE_WARMUP_RANKINGS_CRON:0 0/30 * * * ?}"
    daily-cron: "${SCHEDULE_CACHE_WARMUP_DAILY_CRON:0 0 2 * * ?}"
    clean-expired-cron: "${SCHEDULE_CACHE_WARMUP_CLEAN_EXPIRED_CRON:0 0 3 ? * MON}"
  daily-reset:
    quota-cron: "${SCHEDULE_DAILY_RESET_QUOTA_CRON:0 0 0 * * ?}"
    vip-expiry-cron: "${SCHEDULE_DAILY_RESET_VIP_EXPIRY_CRON:0 0 1 * * ?}"
    expired-data-cron: "${SCHEDULE_DAILY_RESET_EXPIRED_DATA_CRON:0 0 2 * * ?}"
    credit-score-cron: "${SCHEDULE_DAILY_RESET_CREDIT_SCORE_CRON:-}"
    report-cron: "${SCHEDULE_DAILY_RESET_REPORT_CRON:0 0 5 * * ?}"
  credit:
    monthly-reset-cron: "${SCHEDULE_CREDIT_MONTHLY_RESET_CRON:0 0 0 1 * ?}"
  work-time:
    pending-tasks-cron: "${SCHEDULE_WORK_TIME_PENDING_TASKS_CRON:0 */5 * * * ?}"
    moderator-online-refresh-cron: "${SCHEDULE_WORK_TIME_MODERATOR_ONLINE_REFRESH_CRON:0 */1 * * * ?}"
    online-status-cleanup-cron: "${SCHEDULE_WORK_TIME_ONLINE_STATUS_CLEANUP_CRON:0 */30 * * * ?}"
    daily-quota-reset-cron: "${SCHEDULE_WORK_TIME_DAILY_QUOTA_RESET_CRON:0 0 0 * * ?}"
    ending-reminder-cron: "${SCHEDULE_WORK_TIME_ENDING_REMINDER_CRON:0 */5 * * * ?}"
  vip:
    auto-renew-cron: "${SCHEDULE_VIP_AUTO_RENEW_CRON:0 0 * * * ?}"
    expiring-reminder-cron: "${SCHEDULE_VIP_EXPIRING_REMINDER_CRON:0 0 9 * * ?}"
    expired-process-cron: "${SCHEDULE_VIP_EXPIRED_PROCESS_CRON:0 30 0 * * ?}"
  task:
    simple-user:
      daily-classification-cron: "${SCHEDULE_TASK_SIMPLE_USER_DAILY_CLASSIFICATION_CRON:0 0 2 * * ?}"
      bot-check-cron: "${SCHEDULE_TASK_SIMPLE_USER_BOT_CHECK_CRON:0 0 * * * ?}"
    music-intelligence:
      report-refresh-retry-cron: "${SCHEDULE_TASK_MUSIC_INTELLIGENCE_REPORT_REFRESH_RETRY_CRON:0 */5 * * * ?}"
    hot-score:
      calculation-cron: "${SCHEDULE_TASK_HOT_SCORE_CALCULATION_CRON:0 0 2 */3 * ?}"
    file-cleanup:
      daily-cron: "${SCHEDULE_TASK_FILE_CLEANUP_DAILY_CRON:0 0 2 * * ?}"
      weekly-deep-cron: "${SCHEDULE_TASK_FILE_CLEANUP_WEEKLY_DEEP_CRON:0 0 3 ? * SUN}"
      hourly-temp-cron: "${SCHEDULE_TASK_FILE_CLEANUP_HOURLY_TEMP_CRON:0 0 * * * ?}"
    media-derivative-retry-cron: "${SCHEDULE_TASK_MEDIA_DERIVATIVE_RETRY_CRON:0 */5 * * * ?}"
    copyright:
      expiry-check-cron: "${SCHEDULE_TASK_COPYRIGHT_EXPIRY_CHECK_CRON:0 0 2 * * ?}"
      expired-content-cron: "${SCHEDULE_TASK_COPYRIGHT_EXPIRED_CONTENT_CRON:0 0 3 * * ?}"
      inactive-creators-cron: "${SCHEDULE_TASK_COPYRIGHT_INACTIVE_CREATORS_CRON:0 0 4 ? * MON}"


mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.haoran.music.entity
  configuration:
    map-underscore-to-camel-case: true

    cache-enabled: true

    lazy-loading-enabled: true
    aggressive-lazy-loading: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'

    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

    default-executor-type: reuse
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: not_null
      update-strategy: not_null
      select-strategy: not_null










hadoop:
  name-node: hdfs://node1:9000
  hdfs-path: /sdb1/myproject/haoranmusic
  user: hdfs


hive:
  jdbc-url: jdbc:hive2://192.168.153.131:10000/haoranmusic
  username: ${HIVE_USERNAME:hdfs}
  password:


logging:
  level:
    root: INFO
    com.haoran.music: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/haoran-music.log
    max-size: 100MB
    max-history: 30


